<div class="page">
  <header class="page-head">
    <h1>{{ isEdit ? 'Edit Task' : 'Create Task' }}</h1>
  </header>

  @if (loading()) {
    <p class="muted">Loading...</p>
  } @else {
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">

      <div class="field">
        <label for="title">Title <span class="req">*</span></label>
        <input id="title" type="text" formControlName="title" placeholder="e.g. Write Postman tests" />
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <small class="err">Title is required (max 150 characters)</small>
        }
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" rows="4" formControlName="description"
                  placeholder="Add some details (optional)"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="status">Status</label>
          <select id="status" formControlName="status">
            @for (s of statuses; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            }
          </select>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" formControlName="priority">
            @for (p of priorities; track p.value) {
              <option [value]="p.value">{{ p.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="dueDate">Due date</label>
          <input id="dueDate" type="date" formControlName="dueDate" />
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" formControlName="categoryId">
            <option [ngValue]="null">No category</option>
            @for (c of categories(); track c.id) {
              <option [ngValue]="c.id">{{ c.name }}</option>
            }
          </select>
        </div>
      </div>

      @if (error()) {
        <p class="err">{{ error() }}</p>
      }

      <div class="actions">
        <a routerLink="/tasks" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : (isEdit ? 'Update Task' : 'Create Task') }}
        </button>
      </div>
    </form>
  }
</div>
